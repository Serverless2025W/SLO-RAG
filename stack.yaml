version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:8080
functions:
  text-extraction:
    lang: python3-http
    handler: ./text-extraction
    image: ${DOCKER_USER}/text-extraction:latest
    environment:
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "admin"
      MINIO_SECRET_KEY: "password123"
      REDPANDA_BROKER: "redpanda:9092"
      KAFKA_TOPIC: "text-chunks"
      CHUNK_SIZE: "500"
      PYTHONUNBUFFERED: "1"

  embedding-generation:
    lang: python3-http-debian
    handler: ./embedding-generation
    image: ${DOCKER_USER}/embedding-generation:latest
    environment:
      QDRANT_HOST: "qdrant"
      QDRANT_PORT: "6333"
      PYTHONUNBUFFERED: "1"
    limits:
      memory: 1024M
    requests:
      memory: 512M

  conversation-manager:
    lang: python3-http
    handler: ./conversation-manager
    image: ${DOCKER_USER}/conversation-manager:latest
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      KAFKA_BROKER: "redpanda:9092"
      SUMMARIZATION_TOKEN_THRESHOLD: "4000"
      SUMMARIZATION_MESSAGE_THRESHOLD: "20"
      CONVERSATION_TTL: "86400"
      # TODO: Add these LLM environment variables
      # LLM_API_KEY: "${LLM_API_KEY}"
      # LLM_MODEL: "${LLM_MODEL}"
      PYTHONUNBUFFERED: "1"

  context-summarizer:
    lang: python3-http
    handler: ./context-summarizer
    image: ${DOCKER_USER}/context-summarizer:latest
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      CONVERSATION_TTL: "86400"
      # TODO: Add these LLM environment variables
      # LLM_API_KEY: "${LLM_API_KEY}"
      # SUMMARIZATION_MODEL: "${LLM_MODEL}"
      PYTHONUNBUFFERED: "1"
