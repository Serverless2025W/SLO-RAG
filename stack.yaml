version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:8080
functions:
  text-extraction:
    lang: python3-http
    handler: ./text-extraction
    image: ${DOCKER_USER}/text-extraction:latest
    environment:
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "admin"
      MINIO_SECRET_KEY: "password123"
      REDPANDA_BROKER: "redpanda:9092"
      KAFKA_TOPIC: "text-chunks"
      CHUNK_SIZE: "500"
      PYTHONUNBUFFERED: "1"

  embedding-generation:
    lang: python3-http-debian
    handler: ./embedding-generation
    image: ${DOCKER_USER}/embedding-generation:latest
    annotations:
      topic: text-chunks
    environment:
      QDRANT_HOST: "qdrant"
      QDRANT_PORT: "6333"
      COLLECTION_NAME: "embeddings"
      VECTOR_SIZE: "384"
      PYTHONUNBUFFERED: "1"
    limits:
      memory: 2048M
    requests:
      memory: 512M

  query-embedding-retrieval:
    lang: python3-http-debian
    handler: ./query_embedding_retrieval
    image: ${DOCKER_USER}/query-embedding-retrieval:latest
    timeout: 120s
    annotations:
      topic: rag-queries
    environment:
      QDRANT_HOST: "qdrant"
      QDRANT_PORT: "6333"
      COLLECTION_NAME: "embeddings"
      TOP_K: "5"
      ROUTER_URL: "http://gateway:8080/function/router"
      KAFKA_BROKER: "redpanda:9092"
      CONVERSATION_EVENTS_TOPIC: "conversation-events"
      PYTHONUNBUFFERED: "1"
    limits:
      memory: 2048M
    requests:
      memory: 512M

  conversation-manager:
    lang: python3-http
    handler: ./conversation-manager
    image: ${DOCKER_USER}/conversation-manager:latest
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      KAFKA_BROKER: "redpanda:9092"
      SUMMARIZATION_WORKER_TOPIC: "summarization-triggers"
      SUMMARIZATION_TOKEN_THRESHOLD: "5000"
      SUMMARIZATION_MESSAGE_THRESHOLD: "3"
      CONVERSATION_TTL: "86400"
      PYTHONUNBUFFERED: "1"

  context-summarizer:
    lang: python3-http
    handler: ./context-summarizer
    image: ${DOCKER_USER}/context-summarizer:latest
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      CONVERSATION_TTL: "86400"
      SUMMARIZATION_MODEL: "llama-3.3-70b-versatile"
      LLM_API_KEY: "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"
      PYTHONUNBUFFERED: "1"

  local-inference:
    lang: python3-http-debian
    handler: ./local-inference
    image: ${DOCKER_USER}/llm:v1
    timeout: 300s

    build_args:
      CMAKE_ARGS: "-DGGML_CUDA=on"
      ADDITIONAL_PACKAGE: "build-essential cmake git"

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

      write_timeout: 300s
      read_timeout: 300s
      exec_timeout: 300s
  remote-inference:
    lang: python3-http
    handler: ./remote-inference
    image: ${DOCKER_USER}/remote-inference:v1
    environment:
      GROQ_API_KEY: "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"
  router:
    lang: python3-http
    handler: ./router
    image: ${DOCKER_USER}/router:v1
    timeout: 60s

    annotations:
      com.openfaas.scale.min: "1"

